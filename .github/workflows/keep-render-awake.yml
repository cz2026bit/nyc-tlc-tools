name: Keep Render Service Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping web app
        run: |
          curl -fsS --retry 3 --retry-delay 5 https://nyctlc.us/
          curl -fsS --retry 3 --retry-delay 5 https://nyctlc.us/api/service-info
