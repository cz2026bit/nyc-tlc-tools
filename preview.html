<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>纽约 TLC 车牌违章查询</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7f6;
        color: #13221f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      .app {
        min-height: 100vh;
        padding-bottom: 32px;
      }

      .top {
        background: #12312b;
        color: #fff;
        padding: 32px 20px 46px;
      }

      .wrap {
        width: min(760px, calc(100% - 28px));
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      .sub {
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 15px;
        line-height: 1.5;
      }

      .search {
        margin-top: -28px;
        padding: 16px;
        background: #fff;
        border: 1px solid #dde5e2;
        border-radius: 8px;
        box-shadow: 0 10px 28px rgba(16, 32, 28, 0.08);
      }

      .row {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        height: 48px;
        padding: 0 14px;
        border: 1px solid #cbd8d4;
        border-radius: 6px;
        background: #fbfcfc;
        color: #13221f;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      button {
        width: 96px;
        border: 0;
        border-radius: 6px;
        background: #0f7b68;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .hint {
        margin-top: 12px;
        color: #6b7672;
        font-size: 13px;
        line-height: 1.45;
      }

      .notice {
        margin-top: 16px;
        padding: 14px;
        border-radius: 8px;
        background: #fff0ed;
        color: #9b2c1f;
        border: 1px solid #f1b5aa;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
      }

      .summary > div,
      .card {
        background: #fff;
        border: 1px solid #dde5e2;
        border-radius: 8px;
      }

      .summary > div {
        padding: 14px 8px;
        text-align: center;
      }

      .num {
        font-size: 24px;
        font-weight: 800;
      }

      .label {
        margin-top: 4px;
        color: #68736f;
        font-size: 13px;
      }

      h2 {
        margin: 26px 4px 12px;
        font-size: 19px;
      }

      .card {
        margin-bottom: 12px;
        padding: 16px;
      }

      .head {
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }

      .title {
        font-size: 18px;
        font-weight: 800;
      }

      .meta {
        margin-top: 4px;
        color: #68736f;
        font-size: 13px;
      }

      .pill {
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: #e6f4ef;
        color: #0f6b56;
        font-size: 13px;
        line-height: 28px;
        white-space: nowrap;
      }

      .money {
        color: #9b4d00;
        font-size: 18px;
        font-weight: 800;
        white-space: nowrap;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px 18px;
        margin-top: 16px;
      }

      .k {
        color: #73807b;
        font-size: 12px;
      }

      .v {
        margin-top: 3px;
        color: #1b2b28;
        font-size: 14px;
        line-height: 1.35;
        word-break: break-word;
      }

      .details {
        margin-top: 14px;
        border-top: 1px solid #edf1ef;
      }

      .detail {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding-top: 10px;
        font-size: 14px;
        line-height: 1.45;
      }

      .detail span:first-child {
        flex-shrink: 0;
        color: #73807b;
      }

      .detail span:last-child {
        text-align: right;
      }

      .empty {
        margin: 36px 0;
        padding: 28px 16px;
        text-align: center;
        color: #6b7672;
      }

      .home {
        margin-top: -28px;
      }

      .home-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .feature-card {
        width: 100%;
        min-height: 150px;
        padding: 18px;
        border: 1px solid #dde5e2;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 28px rgba(16, 32, 28, 0.08);
        text-align: left;
      }

      .feature-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: #e6f4ef;
        color: #0f6b56;
        font-size: 22px;
        font-weight: 800;
      }

      .feature-title {
        margin-top: 14px;
        color: #13221f;
        font-size: 19px;
        font-weight: 800;
      }

      .feature-desc {
        margin-top: 7px;
        color: #68736f;
        font-size: 13px;
        line-height: 1.45;
      }

      .module {
        margin-top: -28px;
      }

      .hidden {
        display: none !important;
      }

      .module-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        padding: 10px 12px;
        border: 1px solid #dde5e2;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 28px rgba(16, 32, 28, 0.08);
      }

      .back-button {
        width: auto;
        min-width: 106px;
        height: 42px;
        padding: 0 16px;
        border: 0;
        background: #e6f4ef;
        color: #0f6b56;
        font-size: 14px;
        line-height: 42px;
      }

      .module-name {
        color: #13221f;
        font-size: 15px;
        font-weight: 700;
      }

      .tool {
        margin-top: 0;
        padding: 16px;
        background: #fff;
        border: 1px solid #dde5e2;
        border-radius: 8px;
      }

      .tool-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
      }

      .tool-title {
        font-size: 19px;
        font-weight: 800;
      }

      .tool-subtitle {
        margin-top: 5px;
        color: #68736f;
        font-size: 13px;
        line-height: 1.45;
      }

      .upload-button,
      .small-button,
      .secondary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 42px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .upload-button {
        flex-shrink: 0;
        width: 116px;
        background: #143f37;
        color: #fff;
      }

      .small-button,
      .secondary-button {
        border: 1px solid #cbd8d4;
        background: #fff;
        color: #143f37;
      }

      .secondary-button {
        width: 100%;
        margin-top: 10px;
      }

      .small-button {
        width: 72px;
      }

      .file-input {
        display: none;
      }

      .receipt-layout {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        gap: 16px;
        margin-top: 16px;
      }

      .receipt-preview {
        position: relative;
        min-height: 220px;
        overflow: hidden;
        border: 1px dashed #b8c7c2;
        border-radius: 8px;
        background: #f8faf9;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #73807b;
        text-align: center;
        font-size: 14px;
        line-height: 1.45;
      }

      .receipt-preview img {
        width: 100%;
        height: 100%;
        max-height: 420px;
        object-fit: contain;
        display: block;
      }

      .receipt-preview.has-image {
        align-items: stretch;
        justify-content: stretch;
        background: #fff;
      }

      .receipt-overlay {
        position: absolute;
        left: 62%;
        top: 54%;
        min-width: 210px;
        padding: 10px 12px;
        color: #202522;
        font-family: "Courier New", ui-monospace, monospace;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.22;
        text-align: left;
        transform: translate(-50%, -50%);
        pointer-events: none;
        white-space: pre-line;
        text-shadow: 0 0 1px rgba(32, 37, 34, 0.32);
      }

      .receipt-watermark {
        position: absolute;
        right: 18px;
        bottom: 18px;
        padding: 8px 12px;
        border: 2px solid rgba(155, 44, 31, 0.8);
        border-radius: 4px;
        color: rgba(155, 44, 31, 0.9);
        background: rgba(255, 255, 255, 0.72);
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0;
        transform: rotate(-8deg);
        pointer-events: none;
        white-space: nowrap;
      }

      .receipt-preview-tip {
        position: absolute;
        left: 10px;
        bottom: 10px;
        padding: 6px 8px;
        border-radius: 4px;
        background: rgba(19, 49, 43, 0.84);
        color: #fff;
        font-size: 12px;
      }

      .amount-panel {
        min-width: 0;
      }

      .field-label {
        display: block;
        margin-bottom: 7px;
        color: #53605c;
        font-size: 13px;
        font-weight: 700;
      }

      .target-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 120px;
        gap: 10px;
        align-items: end;
      }

      .target-input,
      .amount-input {
        width: 100%;
        text-transform: none;
      }

      .amount-lines {
        display: none;
        margin-top: 14px;
      }

      .amount-line {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr) 42px;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .line-index {
        color: #73807b;
        font-size: 13px;
        text-align: center;
      }

      .remove-button {
        width: 42px;
        height: 42px;
        border: 1px solid #e1c3bb;
        background: #fff8f6;
        color: #9b2c1f;
        font-size: 20px;
        line-height: 42px;
      }

      .receipt-summary {
        display: none;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 14px;
      }

      .receipt-summary > div {
        padding: 12px 8px;
        border-radius: 8px;
        background: #f8faf9;
        border: 1px solid #e2e9e6;
        text-align: center;
      }

      .receipt-status {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #eef8f5;
        color: #0f6b56;
        font-size: 14px;
        line-height: 1.45;
      }

      #add-amount,
      #adjust-amounts {
        display: none;
      }

      @media (max-width: 680px) {
        .top {
          padding: 26px 18px 42px;
        }

        h1 {
          font-size: 25px;
        }

        .wrap {
          width: min(100% - 24px, 760px);
        }

        .home-grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .feature-card {
          width: 100%;
          min-height: 136px;
          padding: 18px;
          display: grid;
          grid-template-columns: 48px 1fr;
          gap: 0 14px;
          align-items: center;
        }

        .feature-icon {
          grid-row: span 2;
          width: 48px;
          height: 48px;
        }

        .feature-title {
          margin-top: 0;
          font-size: 20px;
        }

        .feature-desc {
          margin-top: 4px;
          font-size: 14px;
        }
      }

      @media (max-width: 520px) {
        .row,
        .head {
          align-items: stretch;
        }

        .tool-head,
        .receipt-layout,
        .target-row,
        .home-grid {
          grid-template-columns: 1fr;
        }

        .tool-head {
          display: grid;
        }

        .upload-button {
          width: 100%;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        #submit,
        .small-button,
        .remove-button {
          width: 84px;
        }

        .receipt-overlay {
          min-width: 112px;
          font-size: 14px;
        }

        .receipt-watermark {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="top">
        <div class="wrap">
          <h1>纽约 TLC 工具箱</h1>
          <div class="sub">选择一个功能进入，后续新工具会继续添加在首页。</div>
        </div>
      </section>

      <section class="wrap home" id="home-screen">
        <div class="home-grid">
          <button class="feature-card" type="button" data-open-module="tlc">
            <span class="feature-icon">T</span>
            <div class="feature-title">查 TLC 违章</div>
            <div class="feature-desc">输入车牌号，查询 TLC 车辆资料和停车 / 摄像头违章记录。</div>
          </button>
          <button class="feature-card" type="button" data-open-module="receipt">
            <span class="feature-icon">$</span>
            <div class="feature-title">AI 图片生成</div>
            <div class="feature-desc">上传任意图片，输入 prompt，调用 Gemini 生成一张新图片。</div>
          </button>
        </div>
      </section>

      <section class="wrap module hidden" id="tlc-module">
        <div class="module-bar">
          <button class="back-button" type="button" data-back-home>‹ 返回首页</button>
          <div class="module-name">查 TLC 违章</div>
        </div>
        <form class="search" id="form">
          <div class="row">
            <input id="plate" value="" maxlength="12" autocomplete="off" placeholder="输入车牌号" />
            <button id="submit" type="submit">查询</button>
          </div>
          <div class="hint">这是网页预览版，微信小程序页面使用同一组 NYC Open Data API。</div>
        </form>

        <div id="result"></div>
      </section>

      <section class="wrap module hidden" id="receipt-module">
        <div class="module-bar">
          <button class="back-button" type="button" data-back-home>‹ 返回首页</button>
          <div class="module-name">AI 图片生成</div>
        </div>
        <section class="tool" id="receipt-tool">
          <div class="tool-head">
            <div>
              <div class="tool-title">Gemini 图片生成</div>
              <div class="tool-subtitle">上传一张你有权处理的图片，填写 prompt，后端会调用 Gemini 生成一张新的图片供你保存。</div>
            </div>
            <label class="upload-button">
              上传图片
              <input class="file-input" id="receipt-file" type="file" accept="image/*" />
            </label>
          </div>

          <div class="receipt-layout">
            <div class="receipt-preview" id="receipt-preview">请选择一张图片<br />图片会发送给你配置的 Gemini API 生成新图</div>
            <div class="amount-panel">
              <label>
                <span class="field-label">Prompt</span>
                <textarea class="target-input" id="image-prompt" rows="8" placeholder="例如：把这张图片改成电影海报风格，保留主体人物，背景换成夜景霓虹。"></textarea>
              </label>
              <button class="secondary-button" id="generate-image" type="button">生成新图片</button>
              <button class="secondary-button" id="export-receipt" type="button" disabled>保存生成图片</button>
              <div class="receipt-status" id="receipt-status">上传图片并填写 prompt 后，即可生成一张新的图片。</div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script>
      const API_ROOT = "https://data.cityofnewyork.us/resource";
      const DATASETS = {
        fhvVehicles: "ym4f-sp8x",
        medallionVehicles: "rhe8-mgbb",
        parkingCameraViolations: "nc67-uf89"
      };

      const $ = (selector) => document.querySelector(selector);
      const result = $("#result");
      const receiptState = {
        imageUrl: "",
        sourceBase64: "",
        mimeType: "",
        generatedBase64: "",
        generatedMimeType: "",
        prompt: ""
      };

      function cleanPlate(value) {
        return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      }

      function money(value) {
        return Number(value || 0).toFixed(2);
      }

      function compact(value, fallback = "-") {
        return value === undefined || value === null || value === "" ? fallback : value;
      }

      const API_BASE = window.API_BASE_URL || "";

      async function savePlateSearchRecord(record) {
        try {
          const response = await fetch(`${API_BASE}/api/plate-searches`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(record)
          });
          return response.ok;
        } catch (error) {
          return false;
        }
      }

      function showModule(name) {
        $("#home-screen").classList.toggle("hidden", Boolean(name));
        $("#tlc-module").classList.toggle("hidden", name !== "tlc");
        $("#receipt-module").classList.toggle("hidden", name !== "receipt");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function generateGeminiImage() {
        if (!receiptState.sourceBase64 || !receiptState.mimeType) {
          $("#receipt-status").textContent = "请先上传一张图片。";
          return;
        }

        const prompt = $("#image-prompt").value.trim();
        if (!prompt) {
          $("#receipt-status").textContent = "请先输入 prompt。";
          return;
        }

        receiptState.prompt = prompt;
        $("#generate-image").disabled = true;
        $("#generate-image").textContent = "生成中";
        $("#receipt-status").textContent = "正在调用 Gemini 生成新图片...";

        try {
          const response = await fetch(`${API_BASE}/api/gemini-image`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              prompt,
              mimeType: receiptState.mimeType,
              imageData: receiptState.sourceBase64
            })
          });
          const payload = await response.json();
          if (!response.ok || !payload.ok) {
            throw new Error(payload.error || "gemini_request_failed");
          }

          receiptState.generatedBase64 = payload.imageData;
          receiptState.generatedMimeType = payload.mimeType || "image/png";
          const generatedUrl = `data:${receiptState.generatedMimeType};base64,${receiptState.generatedBase64}`;
          $("#receipt-preview").classList.add("has-image");
          $("#receipt-preview").innerHTML = `<img src="${generatedUrl}" alt="Gemini 生成图片预览" />`;
          $("#export-receipt").disabled = false;
          $("#receipt-status").textContent = "新图片已生成，可以直接保存。";
        } catch (error) {
          $("#receipt-status").textContent = `生成失败：${error.message || "请稍后再试。"}`;
        } finally {
          $("#generate-image").disabled = false;
          $("#generate-image").textContent = "生成新图片";
        }
      }

      async function requestDataset(datasetId, params) {
        const url = new URL(`${API_ROOT}/${datasetId}.json`);
        Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
        const response = await fetch(url);
        if (!response.ok) throw new Error(`NYC Open Data 请求失败 (${response.status})`);
        return response.json();
      }

      function vehicleCard(item) {
        return `
          <article class="card">
            <div class="head">
              <div>
                <div class="title">${item.plate}</div>
                <div class="meta">${item.source}</div>
              </div>
              <div class="pill">${item.status}</div>
            </div>
            <div class="grid">
              <div><div class="k">TLC 牌照号</div><div class="v">${item.licenseNumber}</div></div>
              <div><div class="k">类型</div><div class="v">${item.type}</div></div>
              <div><div class="k">车主 / 公司</div><div class="v">${item.name}</div></div>
              <div><div class="k">Base</div><div class="v">${item.base}</div></div>
              <div><div class="k">到期 / 更新</div><div class="v">${item.updated}</div></div>
            </div>
          </article>
        `;
      }

      function violationCard(item) {
        return `
          <article class="card" style="border-left: 4px solid #d59b2d">
            <div class="head">
              <div>
                <div class="title">${item.violation}</div>
                <div class="meta">罚单号 ${item.summonsNumber}</div>
              </div>
              <div class="money">$${item.amountDue}</div>
            </div>
            <div class="details">
              <div class="detail"><span>日期</span><span>${item.issueDate} ${item.violationTime}</span></div>
              <div class="detail"><span>地点</span><span>${item.county} / Precinct ${item.precinct}</span></div>
              <div class="detail"><span>机构</span><span>${item.agency}</span></div>
              <div class="detail"><span>罚金</span><span>Fine $${item.fineAmount} · Penalty $${item.penaltyAmount} · Paid $${item.paymentAmount}</span></div>
            </div>
          </article>
        `;
      }

      function mapFhv(row) {
        return {
          source: "TLC For-Hire Vehicle",
          plate: compact(row.dmv_license_plate_number),
          licenseNumber: compact(row.vehicle_license_number),
          type: compact(row.license_type),
          name: compact(row.name),
          base: row.base_number ? `${row.base_number} · ${compact(row.base_name)}` : compact(row.base_name),
          updated: row.expiration_date ? `到期 ${row.expiration_date.slice(0, 10)}` : compact(row.last_date_updated),
          status: row.active === "YES" ? "Active" : compact(row.active, "Unknown")
        };
      }

      function mapMedallion(row) {
        return {
          source: "TLC Medallion Vehicle",
          plate: compact(row.dmv_license_plate_number),
          licenseNumber: compact(row.license_number),
          type: compact(row.medallion_type),
          name: compact(row.name),
          base: compact(row.agent_name),
          updated: row.last_updated_date ? `更新 ${row.last_updated_date.slice(0, 10)}` : "-",
          status: row.current_status === "CUR" ? "Current" : compact(row.current_status, "Unknown")
        };
      }

      function mapViolation(row) {
        return {
          summonsNumber: compact(row.summons_number),
          issueDate: compact(row.issue_date),
          violationTime: compact(row.violation_time),
          violation: compact(row.violation, "Unknown violation"),
          amountDue: money(row.amount_due),
          fineAmount: money(row.fine_amount),
          penaltyAmount: money(row.penalty_amount),
          paymentAmount: money(row.payment_amount),
          agency: compact(row.issuing_agency),
          county: compact(row.county),
          precinct: compact(row.precinct)
        };
      }

      async function search(plate) {
        const submit = $("#submit");
        submit.disabled = true;
        submit.textContent = "查询中";
        result.innerHTML = "";

        try {
          const [fhvRows, medallionRows, violationRows] = await Promise.all([
            requestDataset(DATASETS.fhvVehicles, { dmv_license_plate_number: plate, $limit: 20 }),
            requestDataset(DATASETS.medallionVehicles, { dmv_license_plate_number: plate, $limit: 20 }),
            requestDataset(DATASETS.parkingCameraViolations, { plate, $limit: 5000, $order: "issue_date DESC" })
          ]);
          const vehicles = [...fhvRows.map(mapFhv), ...medallionRows.map(mapMedallion)];
          const violations = violationRows.map(mapViolation);
          const totalDue = violations.reduce((sum, item) => sum + Number(item.amountDue || 0), 0);
          await savePlateSearchRecord({
            plate,
            module: "tlc",
            vehicleCount: vehicles.length,
            violationCount: violations.length,
            totalDue: totalDue.toFixed(2),
            status: "success"
          });
          result.innerHTML = `
            <div class="summary">
              <div><div class="num">${vehicles.length}</div><div class="label">TLC 车辆记录</div></div>
              <div><div class="num">${violations.length}</div><div class="label">违章记录</div></div>
              <div><div class="num">$${totalDue.toFixed(2)}</div><div class="label">未付金额</div></div>
            </div>
            ${vehicles.length ? `<h2>TLC 车辆信息</h2>${vehicles.map(vehicleCard).join("")}` : ""}
            ${violations.length ? `<h2>违章记录</h2>${violations.map(violationCard).join("")}` : ""}
            ${!vehicles.length && !violations.length ? `<div class="empty"><strong>没有找到公开记录</strong><br />请确认车牌号拼写，或稍后再试。</div>` : ""}
          `;
        } catch (error) {
          await savePlateSearchRecord({
            plate,
            module: "tlc",
            vehicleCount: 0,
            violationCount: 0,
            totalDue: "0.00",
            status: "failed"
          });
          result.innerHTML = `<div class="notice">${error.message || "查询失败，请稍后再试。"}</div>`;
        } finally {
          submit.disabled = false;
          submit.textContent = "查询";
        }
      }

      $("#plate").addEventListener("input", (event) => {
        event.target.value = cleanPlate(event.target.value);
      });

      $("#form").addEventListener("submit", (event) => {
        event.preventDefault();
        const plate = cleanPlate($("#plate").value);
        if (!plate) {
          result.innerHTML = `<div class="notice">请输入车牌号。</div>`;
          return;
        }
        search(plate);
      });

      document.querySelectorAll("[data-open-module]").forEach((button) => {
        button.addEventListener("click", () => showModule(button.dataset.openModule));
      });

      document.querySelectorAll("[data-back-home]").forEach((button) => {
        button.addEventListener("click", () => showModule(""));
      });

      $("#receipt-file").addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (receiptState.imageUrl) URL.revokeObjectURL(receiptState.imageUrl);
        receiptState.imageUrl = URL.createObjectURL(file);
        receiptState.mimeType = file.type || "image/png";
        receiptState.generatedBase64 = "";
        receiptState.generatedMimeType = "";
        $("#receipt-preview").classList.add("has-image");
        $("#receipt-preview").innerHTML = `<img src="${receiptState.imageUrl}" alt="原始上传图片预览" />`;
        $("#receipt-status").textContent = "图片已上传，填写 prompt 后可以生成新图片。";
        $("#export-receipt").disabled = true;

        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          receiptState.sourceBase64 = result.includes(",") ? result.split(",")[1] : "";
        };
        reader.readAsDataURL(file);
      });

      $("#generate-image").addEventListener("click", generateGeminiImage);

      $("#export-receipt").addEventListener("click", () => {
        if (!receiptState.generatedBase64 || !receiptState.generatedMimeType) {
          $("#receipt-status").textContent = "请先生成一张新图片。";
          return;
        }

        const link = document.createElement("a");
        const extension = receiptState.generatedMimeType.split("/")[1] || "png";
        link.download = `gemini-generated-image.${extension}`;
        link.href = `data:${receiptState.generatedMimeType};base64,${receiptState.generatedBase64}`;
        link.click();
      });

      const initialPlate = cleanPlate($("#plate").value);
      if (initialPlate) search(initialPlate);
    </script>
  </body>
</html>
